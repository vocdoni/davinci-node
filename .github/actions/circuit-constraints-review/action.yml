name: Circuit Constraints Review
description: Compare circuit compile counts against the PR base branch and keep one PR review updated

inputs:
  github-token:
    description: Token used to query workflow runs, download artifacts, and update the review
    required: true
  workflow-file:
    description: Workflow file that publishes the baseline artifact
    required: false
    default: main.yml
  artifact-name:
    description: Artifact name containing the baseline circuit compile log
    required: false
    default: circuit-constraints-log
  base-artifact-dir:
    description: Directory where the baseline artifact should be downloaded
    required: false
    default: base-artifact
  head-log-path:
    description: Path to the PR head circuit compile log
    required: false
    default: circuit-compile.log
  base-log-path:
    description: Name of the circuit compile log inside the downloaded artifact
    required: false
    default: circuit-compile.log
  review-marker:
    description: Marker used to identify the bot review
    required: false
    default: '<!-- circuit-constraints -->'

runs:
  using: composite
  steps:
    - name: Find baseline run
      id: find-baseline
      uses: actions/github-script@v9
      env:
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const baseBranch = context.payload.pull_request.base.ref;
          const workflowId = process.env.WORKFLOW_FILE;
          const artifactName = process.env.ARTIFACT_NAME;

          const runs = await github.paginate(
            'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: baseBranch,
              status: 'completed',
              per_page: 100,
            },
            (response) => response.data.workflow_runs
          );

          const run = runs.find((candidate) => candidate.conclusion === 'success');
          if (!run) {
            core.notice(`No successful ${workflowId} run found on base branch ${baseBranch}`);
            core.setOutput('run_id', '');
            return;
          }

          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: run.id,
            per_page: 100,
          });

          const artifact = artifacts.find((item) => item.name === artifactName && !item.expired);
          if (!artifact) {
            core.notice(`No artifact named ${artifactName} found for run ${run.id} on base branch ${baseBranch}`);
            core.setOutput('run_id', '');
            return;
          }

          core.setOutput('run_id', String(run.id));
          core.notice(`Using baseline artifact from run ${run.id} on base branch ${baseBranch}`);

    - name: Download baseline circuit log
      if: steps.find-baseline.outputs.run_id != ''
      uses: actions/download-artifact@v5
      continue-on-error: true
      with:
        name: ${{ inputs.artifact-name }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.find-baseline.outputs.run_id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ inputs.base-artifact-dir }}

    - name: Review circuit constraint changes
      uses: actions/github-script@v9
      env:
        BASE_LOG_PATH: ${{ inputs.base-artifact-dir }}/${{ inputs.base-log-path }}
        HEAD_LOG_PATH: ${{ inputs.head-log-path }}
        REVIEW_MARKER: ${{ inputs.review-marker }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          const baseBranch = context.payload.pull_request.base.ref;
          const marker = process.env.REVIEW_MARKER;

          const stripAnsi = (line) => line.replace(/\u001B\[[0-9;]*[A-Za-z]/g, '');

          const parseMetrics = (log) => {
            const metrics = {};

            for (const rawLine of log.split(/\r?\n/)) {
              const line = stripAnsi(rawLine);
              if (!line.includes('circuit definition compiled')) {
                continue;
              }

              const circuit = line.match(/\bcircuit=([^\s]+)/)?.[1];
              const nbConstraints = Number(line.match(/\bnbConstraints=(\d+)/)?.[1]);
              const nbPublic = Number(line.match(/\bnbPublic=(\d+)/)?.[1]);
              const nbSecret = Number(line.match(/\bnbSecret=(\d+)/)?.[1]);

              if (
                !circuit ||
                Number.isNaN(nbConstraints) ||
                Number.isNaN(nbPublic) ||
                Number.isNaN(nbSecret)
              ) {
                continue;
              }

              metrics[circuit] = { nbConstraints, nbPublic, nbSecret };
            }

            return metrics;
          };

          const formatDelta = (base, head) => {
            const delta = head - base;
            return delta > 0 ? `+${delta}` : `${delta}`;
          };

          const formatUnavailableBody = () => [
            marker,
            `Circuit constraint comparison is unavailable because no baseline artifact was found for base branch \`${baseBranch}\`.`,
            '',
            `Publish a successful run on \`${baseBranch}\` to generate the baseline artifact.`,
          ].join('\n');

          const formatMatchBody = () => [
            marker,
            `Circuit constraint counts match base branch \`${baseBranch}\`.`,
            '',
            'Re-run `go run ./cmd/circuit-compile --update-config` after constraint-affecting changes.',
          ].join('\n');

          const formatComparisonBody = (diffs) => [
            marker,
            `Circuit constraint counts changed compared to base branch \`${baseBranch}\`.`,
            '',
            '| Circuit | base constraints | PR constraints | Δ constraints | base public | PR public | base secret | PR secret |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |',
            ...diffs.map(({ circuit, base, head }) => {
              const baseConstraints = base ? base.nbConstraints : 'n/a';
              const headConstraints = head ? head.nbConstraints : 'n/a';
              const basePublic = base ? base.nbPublic : 'n/a';
              const headPublic = head ? head.nbPublic : 'n/a';
              const baseSecret = base ? base.nbSecret : 'n/a';
              const headSecret = head ? head.nbSecret : 'n/a';
              const deltaConstraints = base && head ? formatDelta(base.nbConstraints, head.nbConstraints) : 'n/a';

              return `| \`${circuit}\` | ${baseConstraints} | ${headConstraints} | ${deltaConstraints} | ${basePublic} | ${headPublic} | ${baseSecret} | ${headSecret} |`;
            }),
            '',
            'Re-run `go run ./cmd/circuit-compile --update-config` after constraint-affecting changes.',
          ].join('\n');

          const headLog = fs.readFileSync(process.env.HEAD_LOG_PATH, 'utf8');
          const headMetrics = parseMetrics(headLog);
          if (Object.keys(headMetrics).length === 0) {
            throw new Error(`no circuit metrics found in ${process.env.HEAD_LOG_PATH}`);
          }

          let baseMetrics = {};
          let baselineAvailable = false;
          if (fs.existsSync(process.env.BASE_LOG_PATH)) {
            const baseLog = fs.readFileSync(process.env.BASE_LOG_PATH, 'utf8');
            baseMetrics = parseMetrics(baseLog);
            baselineAvailable = Object.keys(baseMetrics).length > 0;
          }

          const circuits = [...new Set([
            ...Object.keys(baseMetrics),
            ...Object.keys(headMetrics),
          ])].sort();

          const diffs = [];
          for (const circuit of circuits) {
            const base = baseMetrics[circuit];
            const head = headMetrics[circuit];
            const isDifferent =
              !baselineAvailable ||
              !base ||
              !head ||
              base.nbConstraints !== head.nbConstraints ||
              base.nbPublic !== head.nbPublic ||
              base.nbSecret !== head.nbSecret;

            if (isDifferent) {
              diffs.push({ circuit, base, head });
            }
          }

          const body = !baselineAvailable
            ? formatUnavailableBody()
            : diffs.length === 0
              ? formatMatchBody()
              : formatComparisonBody(diffs);

          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
            per_page: 100,
          });

          const existingReview = reviews.filter(
            (review) =>
              review.user &&
              review.user.login === 'github-actions[bot]' &&
              typeof review.body === 'string' &&
              review.body.includes(marker)
          ).at(-1) || null;

          if (!existingReview) {
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'COMMENT',
              body,
            });
            core.notice('Created circuit constraint review');
            return;
          }

          if (existingReview.body !== body) {
            await github.rest.pulls.updateReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              review_id: existingReview.id,
              body,
            });
            core.notice('Updated circuit constraint review');
            return;
          }

          core.notice('Circuit constraint review already up to date');
