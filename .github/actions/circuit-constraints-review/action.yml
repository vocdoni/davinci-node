name: Circuit Constraints Review
description: Compare circuit compile counts against the PR base branch and keep one PR review updated

inputs:
  github-token:
    description: Token used to query workflow runs, download artifacts, and update the review
    required: true
  workflow-file:
    description: Workflow file that publishes the baseline artifact
    required: false
    default: main.yml
  artifact-name:
    description: Artifact name containing the baseline circuit compile log
    required: false
    default: circuit-constraints-log-v3
  base-artifact-dir:
    description: Directory where the baseline artifact should be downloaded
    required: false
    default: base-artifact
  base-workdir:
    description: Directory where the fallback base branch checkout should live
    required: false
    default: base-branch
  head-log-path:
    description: Path to the PR head circuit compile log
    required: false
    default: circuit-compile.log
  base-log-path:
    description: Name of the circuit compile log inside the downloaded artifact
    required: false
    default: circuit-compile.log
  review-marker:
    description: Marker used to identify the bot review
    required: false
    default: '<!-- circuit-constraints -->'

runs:
  using: composite
  steps:
    - name: Find baseline run
      id: find-baseline
      uses: actions/github-script@v9
      env:
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const baseBranch = context.payload.pull_request.base.ref;
          const workflowId = process.env.WORKFLOW_FILE;
          const artifactName = process.env.ARTIFACT_NAME;

          const runs = await github.paginate(
            github.rest.actions.listWorkflowRunsForWorkflow,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: baseBranch,
              status: 'completed',
              per_page: 100,
            },
            (response) => response.data.workflow_runs ?? []
          );

          const run = runs.find((candidate) => candidate?.conclusion === 'success');
          if (!run) {
            core.notice(`No successful ${workflowId} run found on base branch ${baseBranch}; compiling fallback baseline`);
            core.setOutput('run_id', '');
            core.setOutput('baseline_mode', 'compile');
            return;
          }

          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: run.id,
            per_page: 100,
          });

          const artifact = artifacts.find((item) => item?.name === artifactName && !item?.expired);
          if (!artifact) {
            core.notice(`No artifact named ${artifactName} found for run ${run.id} on base branch ${baseBranch}; compiling fallback baseline`);
            core.setOutput('run_id', '');
            core.setOutput('baseline_mode', 'compile');
            return;
          }

          core.setOutput('run_id', String(run.id));
          core.setOutput('baseline_mode', 'artifact');
          core.notice(`Using baseline artifact from run ${run.id} on base branch ${baseBranch}`);

    - name: Download baseline circuit log
      if: steps.find-baseline.outputs.run_id != ''
      id: download-baseline
      uses: actions/download-artifact@v5
      continue-on-error: true
      with:
        name: ${{ inputs.artifact-name }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.find-baseline.outputs.run_id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ inputs.base-artifact-dir }}

    - name: Checkout base branch fallback
      if: steps.find-baseline.outputs.baseline_mode == 'compile' || steps.download-baseline.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        path: ${{ inputs.base-workdir }}
        fetch-depth: 0

    - name: Compile fallback baseline
      if: steps.find-baseline.outputs.baseline_mode == 'compile' || steps.download-baseline.outcome == 'failure'
      shell: bash
      working-directory: ${{ inputs.base-workdir }}
      run: go run ./cmd/circuit-compile 2>&1 | tee "${{ inputs.base-log-path }}"

    - name: Review circuit constraint changes
      uses: actions/github-script@v9
      env:
        BASE_ARTIFACT_LOG_PATH: ${{ inputs.base-artifact-dir }}/${{ inputs.base-log-path }}
        BASE_FALLBACK_LOG_PATH: ${{ inputs.base-workdir }}/${{ inputs.base-log-path }}
        HEAD_LOG_PATH: ${{ inputs.head-log-path }}
        REVIEW_MARKER: ${{ inputs.review-marker }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const { parseCompileLog } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/circuit-constraints-review/circuit-constraints-log`);
          const { formatReviewBody, formatNoDiffReviewBody } = require(`${process.env.GITHUB_WORKSPACE}/.github/actions/circuit-constraints-review/circuit-constraints-review`);

          const baseBranch = context.payload.pull_request.base.ref;
          const marker = process.env.REVIEW_MARKER;

          const headLog = fs.readFileSync(process.env.HEAD_LOG_PATH, 'utf8');
          const headMetrics = parseCompileLog(headLog);
          if (Object.keys(headMetrics).length === 0) {
            throw new Error(`no circuit metrics found in ${process.env.HEAD_LOG_PATH}`);
          }

          let baselineSource = 'artifact';
          let baseLogPath = process.env.BASE_ARTIFACT_LOG_PATH;
          if (!fs.existsSync(baseLogPath)) {
            baselineSource = 'compiled base branch';
            baseLogPath = process.env.BASE_FALLBACK_LOG_PATH;
          }

          if (!fs.existsSync(baseLogPath)) {
            throw new Error(`no baseline circuit log found in ${process.env.BASE_ARTIFACT_LOG_PATH} or ${process.env.BASE_FALLBACK_LOG_PATH}`);
          }

          const baseLog = fs.readFileSync(baseLogPath, 'utf8');
          const baseMetrics = parseCompileLog(baseLog);
          if (Object.keys(baseMetrics).length === 0) {
            throw new Error(`no circuit metrics found in ${baseLogPath}`);
          }

          const circuits = [...new Set([
            ...Object.keys(baseMetrics),
            ...Object.keys(headMetrics),
          ])].sort();

          const rows = circuits.map((circuit) => ({
            circuit,
            base: baseMetrics[circuit],
            head: headMetrics[circuit],
          }));

          const diffs = [];
          for (const circuit of circuits) {
            const base = baseMetrics[circuit];
            const head = headMetrics[circuit];
            const isDifferent =
              !base ||
              !head ||
              base.nbConstraints !== head.nbConstraints ||
              base.nbPublicInputs !== head.nbPublicInputs ||
              base.nbPrivateInputs !== head.nbPrivateInputs;

            if (isDifferent) {
              diffs.push({ circuit, base, head });
            }
          }

          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
            per_page: 100,
          });

          const existingReview = reviews.filter(
            (review) =>
              review.user &&
              review.user.login === 'github-actions[bot]' &&
              review.state !== 'DISMISSED' &&
              typeof review.body === 'string' &&
              review.body.includes(marker)
          ).at(-1) || null;

          const reviewNodeId = existingReview?.node_id || existingReview?.nodeId || null;

          const getReviewNode = async (nodeId) => {
            if (!nodeId) {
              return null;
            }

            const result = await github.graphql(
              `
                query($id: ID!) {
                  node(id: $id) {
                    ... on PullRequestReview {
                      isMinimized
                      viewerCanMinimize
                      viewerCanUnminimize
                    }
                  }
                }
              `,
              { id: nodeId }
            );

            return result.node;
          };

          const minimizeReview = async (nodeId) => {
            const reviewNode = await getReviewNode(nodeId);
            if (!reviewNode || reviewNode.isMinimized) {
              return;
            }

            if (!reviewNode.viewerCanMinimize) {
              core.notice('Existing circuit constraint review cannot be minimized');
              return;
            }

            await github.graphql(
              `
                mutation($input: MinimizeCommentInput!) {
                  minimizeComment(input: $input) {
                    minimizedComment {
                      __typename
                    }
                  }
                }
              `,
              {
                input: {
                  subjectId: nodeId,
                  classifier: 'OUTDATED',
                },
              }
            );
          };

          const unminimizeReview = async (nodeId) => {
            const reviewNode = await getReviewNode(nodeId);
            if (!reviewNode || !reviewNode.isMinimized) {
              return;
            }

            if (!reviewNode.viewerCanUnminimize) {
              core.notice('Existing circuit constraint review cannot be unminimized');
              return;
            }

            await github.graphql(
              `
                mutation($input: UnminimizeCommentInput!) {
                  unminimizeComment(input: $input) {
                    unminimizedComment {
                      __typename
                    }
                  }
                }
              `,
              {
                input: {
                  subjectId: nodeId,
                },
              }
            );
          };

          if (diffs.length === 0) {
            if (existingReview) {
              const noDiffBody = formatNoDiffReviewBody({
                marker,
                baseBranch,
                baselineSource,
              });
              if (existingReview.body !== noDiffBody) {
                await github.rest.pulls.updateReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  review_id: existingReview.id,
                  body: noDiffBody,
                });
              }
            }

            await minimizeReview(reviewNodeId);
            core.notice(`Circuit constraint counts match ${baselineSource === 'artifact' ? `the artifact baseline for base branch ${baseBranch}` : `the compiled base branch ${baseBranch}`}; no review posted`);
            return;
          }

          await unminimizeReview(reviewNodeId);

          const body = formatReviewBody({ marker, baseBranch, baselineSource, diffs: rows });

          if (!existingReview) {
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'COMMENT',
              body,
            });
            core.notice('Created circuit constraint review');
            return;
          }

          if (existingReview.body !== body) {
            await github.rest.pulls.updateReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              review_id: existingReview.id,
              body,
            });
            core.notice('Updated circuit constraint review');
            return;
          }

          core.notice('Circuit constraint review already up to date');
