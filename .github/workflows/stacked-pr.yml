name: Stacked PR Check

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  stacked-pr:
    if: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check stacked PR
        id: stacked_pr
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const baseRef = context.payload.pull_request.base.ref;
            const isMain = baseRef === "main";
            if (isMain) {
              core.setOutput("stacked_on", "");
              core.setOutput("review_body", "");
              core.notice("PR is on main");
              return;
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const stackedOn = pulls.find(
              (pr) => pr.number !== prNumber && pr.head && pr.head.ref === baseRef
            );

            if (!stackedOn) {
              core.setOutput("stacked_on", "");
              core.setOutput("review_body", "");
              core.notice("PR is not stacked");
              return;
            }

            core.setOutput("stacked_on", String(stackedOn.number));
            core.setOutput(
              "review_body",
              `This PR is stacked on top of #${stackedOn.number}, please merge that one first`
            );
            core.notice("PR is stacked");

      - uses: actions/checkout@v6

      - name: Review stacked PRs
        uses: ./.github/actions/sticky-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-event: REQUEST_CHANGES
          review-marker: '<!-- stacked-pr -->'
          dismiss-if: ${{ steps.stacked_pr.outputs.stacked_on == '' }}
          review-body: ${{ steps.stacked_pr.outputs.review_body }}
